name: Build and Publish KarenServer

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: karen-server-production-image
  cancel-in-progress: true

jobs:
  build-and-push:
    name: Build and push Docker image
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            robodylan123/karen-server:latest
            robodylan123/karen-server:${{ github.sha }}
          cache-from: type=gha,scope=karen-server
          cache-to: type=gha,mode=max,scope=karen-server
